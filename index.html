<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox — мои инструменты</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-home">

  <!-- Боковое меню -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="menu-btn">☰ <span>МЕНЮ</span></button>
      <div class="lang-switch">
        <a href="#" class="active">RU</a>
        <a href="#">EN</a>
      </div>
    </div>
    <div class="sidebar-bottom">
      <a href="#" title="Telegram">✈</a>
      <a href="#" title="VK">VK</a>
    </div>
  </aside>

  <!-- Основная рабочая область -->
  <main class="main-content">
    <header class="page-header">
      <h1>Инструменты для маркетплейсов</h1>
      <p>Профессиональные решения для управления карточками товаров</p>
    </header>

    <!-- Сетка карточек -->
    <section id="toolsGrid" class="tools-grid" aria-live="polite"></section>

    <!-- Кнопка "Показать еще" (пока просто для красоты, как на макете) -->
    <div class="load-more-container">
      <button class="btn-load-more">Показать еще <span>⌄</span></button>
    </div>
  </main>

  <script src="js/tools.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
