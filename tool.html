<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инструмент — Toolbox</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">

  <header class="site-header compact">
    <div class="wrap header-row">
      <a href="index.html" class="back-link">← Все инструменты</a>
      <h1 id="toolTitle">Загрузка…</h1>
      <span class="spacer"></span>
    </div>
  </header>

  <!-- Стадия 1: инструмент -->
  <section id="stageTool" class="stage">
    <div class="wrap">
      <div class="iframe-shell">
        <iframe id="toolFrame" title="Инструмент" loading="lazy"></iframe>
      </div>
      <div class="actions">
        <button class="btn primary" id="finishBtn">Я закончил(а) — оставить отзыв</button>
        <a class="btn" href="index.html">← На главную</a>
      </div>
    </div>
  </section>

  <!-- Стадия 2: отзыв -->
  <section id="stageReview" class="stage hidden">
    <div class="wrap narrow">
      <div class="review-card">
        <h2>Оставьте отзыв об инструменте</h2>
        <p class="muted" id="reviewToolName"></p>

           <!-- Вставляем iframe от Яндекс Форм -->
        <div style="margin-top: 20px; border-radius: 12px; overflow: hidden;">
          <iframe src="https://forms.yandex.ru/u/6adf1cd36d2d73a8cb299c38/?iframe=1" frameborder="0" name="ya-form-6adf1cd36d2d73a8cb299c38" width="100%" height="600px"></iframe>
        </div>

        <div class="actions" style="margin-top: 20px; display: flex; justify-content: center;">
          <a class="btn" href="index.html">← Пропустить и вернуться на главную</a>
        </div>
        </form>
      </div>
    </div>
  </section>

  <!-- Стадия 3: благодарность -->
  <section id="stageThanks" class="stage hidden">
    <div class="wrap narrow center">
      <div class="thanks-card">
        <div class="thanks-emoji">🙏</div>
        <h2>Спасибо за отзыв!</h2>
        <p class="muted">Вы помогаете сделать инструменты лучше.</p>
        <p class="muted">Через <span id="countdown">3</span> сек. вернёмся на главную…</p>
        <a class="btn primary" href="index.html">Вернуться сейчас</a>
      </div>
    </div>
  </section>

  <script src="js/tools.js"></script>
  <script src="js/reviews.js"></script>
</body>
</html>
