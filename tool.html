<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инструмент — Toolbox</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">

  <header class="site-header compact">
    <div class="wrap header-row">
      <a href="index.html" class="back-link">← Все инструменты</a>
      <h1 id="toolTitle">Загрузка…</h1>
      <span class="spacer"></span>
    </div>
  </header>

  <!-- Стадия 1: инструмент -->
  <section id="stageTool" class="stage">
    <div class="wrap">
      <div class="iframe-shell">
        <iframe id="toolFrame" title="Инструмент" loading="lazy"></iframe>
      </div>
      <div class="actions">
        <button class="btn primary" id="finishBtn">Я закончил(а) — оставить отзыв</button>
        <a class="btn" href="index.html">← На главную</a>
      </div>
    </div>
  </section>

  <!-- Стадия 2: отзыв -->
  <section id="stageReview" class="stage hidden">
    <div class="wrap narrow">
      <div class="review-card">
        <h2>Оставьте отзыв об инструменте</h2>
        <p class="muted" id="reviewToolName"></p>

        <!-- Белая подложка для формы Яндекса -->
        <div style="background: #ffffff; border-radius: 16px; padding: 10px; margin-top: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
          <iframe 
            src="https://forms.yandex.ru/u/6adf1cd36d2d73a8cb299c38/?iframe=1" 
            frameborder="0" 
            name="ya-form-6adf1cd36d2d73a8cb299c38" 
            width="100%" 
            height="650px" 
            style="border: none; display: block; border-radius: 8px;">
          </iframe>
        </div>

        <div class="actions" style="margin-top: 20px; display: flex; justify-content: center;">
          <a class="btn" href="index.html">← Вернуться на главную</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Подключаем только нужные скрипты -->
  <script src="js/tools.js"></script>
  <script src="js/tool.js"></script>
</body>
</html>
