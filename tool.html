<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инструмент — Toolbox</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">

  <!-- Шапка страницы инструмента -->
  <header class="site-header">
    <div class="header-row">
      <a href="index.html" class="back-link">← Все инструменты</a>
      <h1 id="toolTitle">Загрузка…</h1>
    </div>
  </header>

  <!-- Стадия 1: Сам инструмент (iframe) -->
  <section id="stageTool" class="stage">
    <div class="wrap">
      <div class="iframe-shell">
        <iframe id="toolFrame" title="Инструмент" loading="lazy"></iframe>
      </div>
      <div class="actions">
        <button class="btn primary" id="finishBtn">Я закончил(а) — оставить отзыв</button>
        <a class="btn" href="index.html">← На главную</a>
      </div>
    </div>
  </section>

  <!-- Стадия 2: Форма отзыва (Яндекс) -->
  <section id="stageReview" class="stage hidden">
    <div class="wrap narrow">
      <div class="review-card">
        <h2>Оставьте отзыв об инструменте</h2>
        <p class="muted" id="reviewToolName"></p>

        <!-- Белая подложка для формы Яндекса -->
        <div style="background: #ffffff; border-radius: 12px; padding: 10px; margin-top: 20px; border: 1px solid #e0e0e0;">
          <iframe 
            src="https://forms.yandex.ru/u/6adf1cd36d2d73a8cb299c38/?iframe=1" 
            frameborder="0" 
            name="ya-form-6adf1cd36d2d73a8cb299c38" 
            width="100%" 
            height="650px" 
            style="border: none; display: block; border-radius: 8px;">
          </iframe>
        </div>

        <div class="actions" style="margin-top: 20px;">
          <a class="btn" href="index.html">← Вернуться на главную</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Стадия 3: Благодарность (скрыта, на всякий случай) -->
  <section id="stageThanks" class="stage hidden">
    <div class="wrap narrow">
      <div class="thanks-card">
        <div class="thanks-emoji">🙏</div>
        <h2>Спасибо за отзыв!</h2>
        <p class="muted">Вы помогаете сделать инструменты лучше.</p>
        <a class="btn primary" href="index.html">Вернуться на главную</a>
      </div>
    </div>
  </section>

  <!-- Скрипты для работы логики -->
  <script src="js/tools.js"></script>
  <script src="js/tool.js"></script>
</body>
</html>
